[package]
name = "dgn-ffi"
description = "C ABI of the DGN reader (dgn.dll / libdgn.so / libdgn.dylib); header in include/dgn.h"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "dgn"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
dgn-model.workspace = true
dgn-read.workspace = true
dgn-export.workspace = true
serde_json.workspace = true

[dev-dependencies]
dgn-read = { workspace = true, features = ["synth"] }
